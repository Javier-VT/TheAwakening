name: Forge Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Reconstruct Stage 2 baseline
        run: |
          cat min_payload/part*.b64 > minimal-project.b64
          base64 --decode minimal-project.b64 > minimal-project.zip
          echo "Baseline payload SHA-256: $(sha256sum minimal-project.zip)"
          unzip -t minimal-project.zip
          rm -rf project
          mkdir project
          unzip -q minimal-project.zip -d project

      - name: Apply Stage 3 overlay
        run: |
          cp -a stage3_patch/. project/
          test -f project/src/main/java/com/theawakening/health/HealthManager.java
          test -f project/src/main/java/com/theawakening/difficulty/DifficultyProfile.java

      - name: Apply Stage 4 source overlay
        run: |
          cp -a stage4_patch/. project/
          grep '^mod_version=' project/gradle.properties
          test -f project/src/main/java/com/theawakening/revive/ReviveManager.java
          test -f project/src/main/java/com/theawakening/revive/ReviveEvents.java
          test -f project/src/main/java/com/theawakening/death/DeathEchoManager.java
          test -f project/src/main/java/com/theawakening/network/packet/ReviveIntentPacket.java
          test -f project/src/main/java/com/theawakening/client/ClientReviveInput.java

      - name: Run Stage 2 through Stage 4 validators
        working-directory: project
        run: |
          python scripts/validate_stage2.py
          python scripts/validate_stage3.py
          python scripts/validate_stage4.py

      - name: Show Stage 4 project
        working-directory: project
        run: |
          java -version
          gradle --version
          find src/main/java/com/theawakening/revive src/main/java/com/theawakening/death -type f | sort

      - name: Build with ForgeGradle
        working-directory: project
        run: gradle --no-daemon clean build verifyProductionJar --stacktrace

      - name: Validate output
        working-directory: project
        run: |
          ls -lah build/libs
          JAR=$(find build/libs -maxdepth 1 -type f -name 'theawakening-0.4.0-stage4.jar' | head -1)
          test -n "$JAR"
          echo "Built: $JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep 'META-INF/mods.toml'
          unzip -l "$JAR" | grep 'com/theawakening/revive/ReviveManager.class'
          unzip -l "$JAR" | grep 'com/theawakening/revive/ReviveEvents.class'
          unzip -l "$JAR" | grep 'com/theawakening/death/DeathEchoManager.class'
          unzip -l "$JAR" | grep 'com/theawakening/network/packet/ReviveIntentPacket.class'
          unzip -l "$JAR" | grep 'com/theawakening/client/ClientReviveInput.class'
          if unzip -p "$JAR" com/theawakening/registry/ModCreativeTabs.class | strings | grep -q 'CREATIVE_MODE_TAB'; then
            echo 'ERROR: development mapping marker found; JAR does not look reobfuscated.'
            exit 1
          fi

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: theawakening-0.4.0-stage4
          path: project/build/libs/*.jar
          if-no-files-found: error
