name: Forge Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Reconstruct Stage 2 baseline
        run: |
          cat min_payload/part*.b64 > minimal-project.b64
          base64 --decode minimal-project.b64 > minimal-project.zip
          unzip -t minimal-project.zip
          rm -rf project
          mkdir project
          unzip -q minimal-project.zip -d project

      - name: Apply Stage 3 overlay
        run: |
          cp -a stage3_patch/. project/
          test -f project/src/main/java/com/theawakening/health/HealthManager.java
          test -f project/src/main/java/com/theawakening/difficulty/DifficultyProfile.java

      - name: Apply Stage 4 overlay
        run: |
          cp -a stage4_patch/. project/
          test -f project/src/main/java/com/theawakening/revive/ReviveManager.java
          test -f project/src/main/java/com/theawakening/death/DeathEchoManager.java

      - name: Apply Stage 5 source overlay
        run: |
          cat stage5_source_payload/part*.b64 > stage5-source.b64
          base64 --decode stage5-source.b64 > stage5-source.zip
          echo "603b9641e29e764f0c1db82c6107b871c47753d90b31581f260e5ba975431eca  stage5-source.zip" | sha256sum -c -
          unzip -t stage5-source.zip
          unzip -oq stage5-source.zip -d project
          grep '^mod_version=' project/gradle.properties
          test -f project/src/main/java/com/theawakening/food/WellFedEffect.java
          test -f project/src/main/java/com/theawakening/potion/ModPotions.java
          test -f project/src/main/java/com/theawakening/potion/BrewingManager.java
          test -f project/scripts/generate_stage5_assets.py

      - name: Generate Stage 5 resources and validate Stage 2 through Stage 5
        working-directory: project
        run: |
          python scripts/generate_stage5_assets.py
          python scripts/validate_stage2.py
          python scripts/validate_stage3.py
          python scripts/validate_stage4.py
          python scripts/validate_stage5.py

      - name: Show Stage 5 project
        working-directory: project
        run: |
          java -version
          gradle --version
          find src/main/java/com/theawakening/food src/main/java/com/theawakening/potion -type f | sort
          echo "Recipes: $(find src/main/resources/data/theawakening/recipes -type f -name '*.json' | wc -l)"
          echo "Item textures: $(find src/main/resources/assets/theawakening/textures/item -type f -name '*.png' | wc -l)"

      - name: Build with ForgeGradle
        working-directory: project
        run: gradle --no-daemon clean build verifyProductionJar --stacktrace

      - name: Validate output
        working-directory: project
        run: |
          ls -lah build/libs
          JAR=$(find build/libs -maxdepth 1 -type f -name 'theawakening-0.5.0-stage5.jar' | head -1)
          test -n "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep 'META-INF/mods.toml'
          unzip -l "$JAR" | grep 'com/theawakening/food/WellFedEffect.class'
          unzip -l "$JAR" | grep 'com/theawakening/food/WellFedSupport.class'
          unzip -l "$JAR" | grep 'com/theawakening/potion/ModPotions.class'
          unzip -l "$JAR" | grep 'com/theawakening/potion/BrewingManager.class'
          unzip -l "$JAR" | grep 'com/theawakening/potion/AwakeningBrewingRecipe.class'
          unzip -l "$JAR" | grep 'data/theawakening/recipes/hearth_stew.json'
          unzip -l "$JAR" | grep 'assets/theawakening/textures/mob_effect/well_fed.png'
          COUNT=$(unzip -l "$JAR" | grep 'assets/theawakening/textures/item/.*\.png' | wc -l)
          test "$COUNT" -ge 23
          if unzip -p "$JAR" com/theawakening/registry/ModCreativeTabs.class | strings | grep -q 'CREATIVE_MODE_TAB'; then
            echo 'ERROR: development mapping marker found; JAR does not look reobfuscated.'
            exit 1
          fi

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: theawakening-0.5.0-stage5
          path: project/build/libs/*.jar
          if-no-files-found: error
